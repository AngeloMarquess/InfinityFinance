<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InfinityFinance • Controle Financeiro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>InfinityFinance</h1>

    <section class="saldo">
      <h2>Saldo Atual</h2>
      <p id="saldo">R$ 0,00</p>
    </section>

    <section class="resumo">
  <div class="card receita">
    <p>Receitas</p>
    <strong id="totalReceitas">R$ 0,00</strong>
  </div>

  <section class="grafico">
  <h2>Visão Geral</h2>
  <canvas id="graficoFinanceiro" height="120"></canvas>
</section>


  <div class="card despesa">
    <p>Despesas</p>
    <strong id="totalDespesas">R$ 0,00</strong>
  </div>
</section>


    <form id="form">
      <input type="text" id="descricao" placeholder="Descrição" required />
      <input type="number" id="valor" placeholder="Valor" step="0.01" required />
      <select id="tipo">
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>

    <ul id="lista"></ul>
  </main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js?v=2"></script>

</body>
</html>
